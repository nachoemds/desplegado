<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Autoridades</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Condensed:wght@300;400;500;700&display=swap" rel="stylesheet">
<style id="pagesize">@page{size:A4;margin:0}</style>
<style>
/* ====== TAMAÑO ======
   Todo el diseño está en "em"; la hoja mide 100em de ancho.
   A4 y A3 solo cambian el font-size => escala vectorial, sin deformar.
   Para A3: <body class="a3"> */
:root{
  --azul:#0b5ea8; --azul2:#0a7ec2; --card:#d3e3f4; --gris:#e1e1e1; --txt:#222;
  --W:210mm;
}
body.a3{ --W:297mm; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#888}
body{font-family:"Roboto","Helvetica Neue",Arial,sans-serif;padding-top:3.6rem;color:var(--txt)}
.page{
  width:var(--W); aspect-ratio:210/297; margin:0 auto; background:#fff;
  font-size:calc(var(--W)/100); position:relative; overflow:hidden; display:flex; flex-direction:column;
}
/* encabezado */
.head{flex:none;background:var(--azul);height:9.5em;display:flex;align-items:center;justify-content:space-between;padding:0 4em}
.head .logo{width:6.6em;flex:none}.head .logo svg{width:100%;height:auto;display:block}
.head h1{color:#fff;font-size:3.1em;font-weight:700;letter-spacing:.06em}
/* autoridades */
.auth{flex:none;background:var(--gris);height:24.2em;padding:1em 4em;display:flex;flex-direction:column;justify-content:space-between}
.auth .row{display:flex;justify-content:space-between;align-items:center}
.auth .row.c{justify-content:center}
.auth .p{display:flex;align-items:center;gap:.9em}
.auth .p .ph{width:7em;height:7em}
.auth .p.big .ph{width:8em;height:8em}
.auth .t{line-height:1.15;max-width:13em}
.auth .n{color:var(--azul2);font-weight:700;font-size:1.05em}
.auth .n b{font-weight:800}
.auth .r{font-size:.62em;color:#777;text-transform:uppercase;margin-top:.15em}
/* foto circular (con silueta si falta la imagen) */
.ph{border-radius:50%;overflow:hidden;background:#c9c9c9 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='38' r='17' fill='%23555'/><path d='M14 100c0-28 16-40 36-40s36 12 36 40z' fill='%23555'/></svg>") center/cover;
  border:.15em solid #fff;box-shadow:0 0 .3em rgba(0,0,0,.25);flex:none}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
/* grilla de provincias */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(8,minmax(0,1fr));gap:1em 4.4em;padding:0 4em;margin:1.9em 0 3.6em}
.prov{display:flex;flex-direction:column;min-height:0}
.prov .tit{flex:none;background:var(--azul);color:#fff;font-weight:800;font-size:.78em;text-transform:uppercase;padding:.15em 1em;border-radius:1em;height:1.35em;line-height:1.2em;position:relative;z-index:1}
.prov .card{flex:1;min-height:0;background:var(--card);border-radius:0 0 1.2em 1.2em;margin-top:-.7em;padding:1em .8em 1em;display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;align-content:start}
.leg{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.1}
.leg .ph{width:5.8em;height:5.8em;margin-bottom:.2em}
.leg .nom{font-family:"Roboto Condensed",sans-serif;font-weight:300;font-size:.62em;margin-top:.1em;height:1.2em;display:flex;align-items:flex-end}
.leg .ape{font-family:"Roboto Condensed",sans-serif;font-size:.82em;font-weight:500;text-transform:uppercase;white-space:nowrap}
.leg .par{font-family:"Roboto Condensed",sans-serif;background:var(--azul2);color:#fff;font-size:.58em;font-weight:700;text-transform:uppercase;width:100%;margin-top:.35em;padding:.25em .2em;min-height:2.1em;display:flex;align-items:center;justify-content:center;line-height:1.05}
/* pie */
.foot{position:absolute;left:0;right:0;bottom:0;height:2.6em;background:var(--azul);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 4em;font-size:.62em;font-weight:700}
/* impresión */
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{position:fixed;top:0;left:0;right:0;z-index:10;background:#1c1c1c;color:#fff;font:14px Roboto,Arial,sans-serif;display:flex;gap:.6rem;align-items:center;padding:.6rem 1rem}
.bar button,.bar select{font:inherit;padding:.35rem .8rem;border-radius:6px;border:0;cursor:pointer}
.bar button{background:#0a7ec2;color:#fff}.bar button:disabled{opacity:.5}
#estado{opacity:.75;margin-left:.5rem}
@media print{
  html,body{background:none;padding:0}
  .bar{display:none}
  .page{margin:0}
}
</style>

<script>
/* =========================================================

   Si no hay foto, se muestra la silueta.

const CONFIG = {

  actualizado: "02/10/2026",

  // Probar sin editar: index.html?fotos=local  (usa ./fotos/)  o  ?fotos=https://.../fotos/
  fotos: "https://raw.githubusercontent.com/nachoemds/desplegado/main/public/fotos/"
};
const FOTOS_BASE = (() => {
  let b = new URLSearchParams(location.search).get("fotos") || CONFIG.fotos;
  if (b === "local") b = "fotos/";

})();

// [nombre, APELLIDO, cargo]

const P = {

  CF:"CONVICCIÓN FEDERAL", PRO:"FRENTE PRO", PU:"PROVINCIAS UNIDAS",
  JSF:"JUSTICIA SOCIAL FEDERAL"

// Provincias en el orden en que se dibujan (izq→der, arriba→abajo)
// [nombre, APELLIDO, partido(clave de P o texto libre)]; null = sin foto/nombre

 ["Chaco",[["Juan Cruz","GODOY","LLA"],["Silvana Lorena","SCHNEIDER","UCR"],["Jorge Milton","CAPITANICH","J"]]],
 ["Chubut",[["Edith Elizabeth","TERENZI","DESPIERTA CHUBUT"],["Andrea Marcela","CRISTINA","PRO"],["Carlos Alberto","LINARES","J"]]],

 ["Formosa",[["José Miguel Ángel","MAYANS","J"],["María Teresa Margarita","GONZÁLEZ","J"],["Francisco Manuel","PAOLTRONI","LLA"]]],
 ["Jujuy",[["Ezequiel","ATAUCHE","LLA"],["Vilma Facunda","BEDIA","LLA"],["María Carolina","MOISÉS","CF"]]],
 ["La Pampa",[["María Victoria","HUALA","PRO"],["Daniel Ricardo","KRONEBERGER","UCR"],["Daniel Pablo","BENSUSÁN","J"]]],
 ["La Rioja",[["María Florencia","LÓPEZ","J"],["Jesús Fernando","REJAL","JSF"],["","","LLA"]]],
 ["Mendoza",[["Mariana","JURI","UCR"],["Rodolfo Alejandro","SUÁREZ","UCR"],["Anabel","FERNÁNDEZ SAGASTI","J"]]],
 ["Misiones",[["Carlos Omar","ARCE","MOVIMIENTO POR MISIONES"],["Sonia Elizabeth","ROJAS DECUT","MOVIMIENTO POR MISIONES"],["Enrique Martín","GOERLING LARA","PRO"]]],

 ["Río Negro",[["Martín Ignacio","SORIA","J"],["Ana Inés","MARKS","J"],["Enzo Paolo","FULLONE","LLA"]]],
 ["Salta",[["María Emilia","OROZCO","LLA"],["Gonzalo","GUZMÁN CORAITA","LLA"],["Flavia Gabriela","ROYON","PRIMERO LOS SALTEÑOS"]]],
 ["San Juan",[["Sergio Mauricio","UÑAC","J"],["María Celeste","GIMÉNEZ NAVARRO","J"],["Bruno Antonio","OLIVERA LUCERO","LLA"]]],
 ["San Luis",[["Bartolomé Esteban","ABDALA","LLA"],["Ivanna Marcela","ARRASCAETA","LLA"],["Fernando Aldo","SALINO","JSF"]]],
 ["Santa Cruz",[["José María","CARAMBIA","MOVERE SANTA CRUZ"],["Natalia Elena","GADANO","MOVERE SANTA CRUZ"],["Alicia Margarita","KIRCHNER","J"]]],
 ["Santa Fe",[["Carolina","LOSADA","UCR"],["Eduardo Horacio","GALARETTO","UCR"],["Marcelo Néstor","LEWANDOWSKI","J"]]],
 ["Santiago del Estero",[["Gerardo","ZAMORA","FRENTE CÍVICO POR SANTIAGO"],["Elia Esther del Carmen","MORENO","FRENTE CÍVICO POR SANTIAGO"],["José Emilio","NEDER","J"]]],
 ["Tierra del Fuego",[["Agustín Pedro","COTO","LLA"],["María Belén","MONTE DE OCA","LLA"],["Cándida Cristina","LÓPEZ","J"]]],
 ["Tucumán",[["Sandra Mariela","MENDOZA","CF"],["Juan Luis","MANZUR","J"],["Beatriz Luisa","AVILA","INDEPENDENCIA"]]]

/* ================= RENDER ================= */
const slug = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
/* Fotos: prueba cada fuente en orden y, en cada una, "apellido-primernombre.png"
   (homónimos, ej. LOPEZ FLORENCIA.png) y después "APELLIDO.png" (ej. VILLARRUEL.png).
   Abierto con doble clic (file://) prueba primero ./fotos/ y después GitHub; online, al revés.
   Con ?fotos=local o ?fotos=URL usa solo esa. Si ninguna existe, muestra la silueta. */
const BASES = (() => {
  const q = new URLSearchParams(location.search).get("fotos");
  const norm = b => b === "local" ? "fotos/" : (b.endsWith("/") ? b : b + "/");
  if (q) return [norm(q)];
  return ["fotos/", "public/fotos/", norm(CONFIG.fotos)];   // mismo sitio primero, GitHub raw al final
})();
const esWeb = u => /^https?:/.test(u);
// Nombres de archivo aceptados (sin tildes; la Ñ se prueba con y sin tilde), todos con .png:
//   ABAD · BENEGAS LYNCH   |   abad · benegas lynch   |   benegas-lynch   |   benegaslynch
// y, para homónimos, "APELLIDO NOMBRE" primero (ej. lopez florencia.png, ABDALA BARTOLOME.png).
const up = (t, keepN) => t.normalize("NFD").replace(/[\u0300-\u036f]/g,(c,i,str)=> keepN && c==="\u0303" && /n/i.test(str[i-1]) ? c : "").normalize("NFC").toUpperCase().trim();
const formas = t => [t, t.toLowerCase(), t.toLowerCase().replace(/\s+/g,"-"), t.toLowerCase().replace(/\s+/g,"")];
const nombres = (n,a) => [...new Set([true,false].flatMap(k => [up(a+" "+n.split(" ")[0],k), up(a,k)]).flatMap(formas))];
const rutas = (n,a) => BASES.flatMap(b => nombres(n,a).map(x => b + encodeURIComponent(x) + ".png"));
const foto = (n,a) => {
  if(!n && !a) return "";
  const r = rutas(n,a);
  return `<img data-r='${JSON.stringify(r)}' data-i="0"${esWeb(r[0]) ? ' crossorigin="anonymous"' : ''} alt="" onload="fotoOk()" onerror="fotoFallback(this)" src="${r[0]}">`;
};
function fotoFallback(img){
  const r = JSON.parse(img.dataset.r), i = +img.dataset.i + 1;
  if(i < r.length){ img.dataset.i = i; img.crossOrigin = esWeb(r[i]) ? "anonymous" : null; img.src = r[i]; }
  else { img.remove(); FALTAN.push(r[0]); resumen(); }
}
let OK = 0; const FALTAN = [];
function fotoOk(){ OK++; resumen(); }
function resumen(){
  const e = document.getElementById("estado"); if(!e) return;
  e.textContent = `v7 · fotos: ${OK} ok, ${FALTAN.length} sin encontrar`;
  e.title = FALTAN.slice(0,5).map(u => new URL(u, location.href).href).join("\n");
  if(FALTAN.length) console.warn("Sin foto (1er intento):", FALTAN.map(u => new URL(u, location.href).href));
}
const cap = s => s.charAt(0)+s.slice(1).toLowerCase();

document.querySelector(".head h1").textContent = CONFIG.titulo;
document.getElementById("fecha").textContent = "ACTUALIZADO AL " + CONFIG.actualizado;
document.getElementById("area").textContent = CONFIG.area;

document.getElementById("auth").innerHTML = AUTORIDADES.map((fila,i)=>
  `<div class="row ${i==0?"c":""}">` + fila.map(([n,a,r])=>
    `<div class="p ${i==0?"big":""}"><div class="ph">${foto(n,a)}</div>
     <div class="t"><div class="n">${n}<br><b>${a}</b></div><div class="r">${r}</div></div></div>`
  ).join("") + `</div>`).join("");

document.getElementById("grid").innerHTML = PROVINCIAS.map(([prov,legs])=>
  `<div class="prov"><div class="tit">${prov}</div><div class="card">` +
  legs.map(([n,a,p])=>
    `<div class="leg"><div class="ph">${foto(n,a)}</div>
     <div class="nom">${n}</div><div class="ape">${a}</div>
     <div class="par">${P[p]||p}</div></div>`).join("") +
  `</div></div>`).join("");

/* ================= EXPORTAR ================= */
const $ = id => document.getElementById(id), estado = t => $("estado").textContent = t || "";
function setFormat(f){
  document.body.classList.toggle("a3", f==="a3"); $("fmt").value = f;
  $("pagesize").textContent = `@page{size:${f==="a3"?"A3":"A4"};margin:0}`;
}
setFormat((new URLSearchParams(location.search).get("fmt")||"a4").toLowerCase());
$("fmt").onchange = e => setFormat(e.target.value);

async function listo(){            // espera fuentes e imágenes
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
}
$("bPdf").onclick = async () => {
  await listo();
  alert("En el diálogo: Destino = Guardar como PDF · Márgenes = Ninguno · activar 'Gráficos de fondo'.\nTamaño: " + $("fmt").value.toUpperCase());
  window.print();
};
$("bJpg").onclick = async () => {
  const b = $("bJpg"); b.disabled = true; estado("Generando…");
  try{
    await listo();
    if(!window.html2canvas) await new Promise((ok,ko)=>{ const s=document.createElement("script");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"; s.onload=ok; s.onerror=ko; document.head.appendChild(s); });
    const f = $("fmt").value, mm = f==="a3" ? 297 : 210, el = $("page");
    const canvas = await html2canvas(el,{scale: Math.round(mm/25.4*300)/el.offsetWidth, useCORS:true, backgroundColor:"#fff"});
    canvas.toBlob(blob=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download=`autoridades_${f}.jpg`; a.click(); estado("Listo"); }, "image/jpeg", .95);
  }catch(e){
    console.error(e);
    estado("No se pudo (¿fotos locales abiertas con doble clic?). Usá fotos online, un servidor local o export.mjs");
  }finally{ b.disabled = false; }
};
